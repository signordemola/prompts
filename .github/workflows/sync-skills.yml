name: Skills Updated Notification
# Creates a GitHub issue when skills are updated, so you know
# to run `bash .ai-skills/update.sh` in your active projects.

on:
  push:
    branches: [main]
    paths:
      - 'ai-skills/docs/**'
      - 'ai-skills/AGENTS.md'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- ai-skills/ 2>/dev/null | head -30)
          if [ -z "$CHANGED" ]; then
            COUNT=0
          else
            COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
          fi
          
          # Build summary
          AREAS=""
          echo "$CHANGED" | grep -q "workflows/" && AREAS="$AREAS workflows"
          echo "$CHANGED" | grep -q "skills/" && AREAS="$AREAS skills"
          echo "$CHANGED" | grep -q "domains/" && AREAS="$AREAS domains"
          echo "$CHANGED" | grep -q "references/" && AREAS="$AREAS references"
          echo "$CHANGED" | grep -q "AGENTS.md" && AREAS="$AREAS agents"
          echo "$CHANGED" | grep -q "ROUTER.md" && AREAS="$AREAS router"
          
          echo "areas=$AREAS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        run: |
          gh label create "skills-update" --color "1d76db" --description "Skills library was updated" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create notification issue
        if: steps.changes.outputs.count > 0
        run: |
          gh issue create \
            --title "🔄 Skills updated — run update.sh in active projects" \
            --body "### AI Skills library was updated

          **Changed areas:**${{ steps.changes.outputs.areas }}

          Run this in each active project to get the latest:
          \`\`\`bash
          bash .ai-skills/update.sh
          \`\`\`

          Or update only what changed:
          \`\`\`bash
          bash .ai-skills/update.sh --only <area>
          \`\`\`

          Close this issue after updating your projects." \
            --label "skills-update"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

